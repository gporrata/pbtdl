[package]
name = "pbtdl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Browser-driven Pirate Bay-compatible search and local downloader CLI"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
data-encoding = "2"
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
